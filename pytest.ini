[pytest]
pythonpath = .
testpaths = products/paystudio/tests
python_files = test_*.py

# --- Configuración de Logs en Consola (Live Logging) ---
log_cli = true
# Mantenemos INFO por defecto para limpieza, pero el framework permitirá DEBUG vía .env
log_cli_level = INFO
# El formato debe ser compatible con tu ColorFormatter
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)-15s | %(message)s
log_cli_date_format = %H:%M:%S

# --- Configuración de Logs en Archivo (Persistencia Técnica) ---
# Esto asegura que aunque en consola veas poco, en el archivo esté TODO el detalle técnico.
log_file = reports/execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)-15s | [%(filename)s:%(lineno)d] | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# --- Opciones de ejecución ---
addopts =
    -ra
    -v
    -s
    --tb=short
    --capture=no
    --color=yes
    -p no:cacheprovider
    --html=reports/report.html
    --self-contained-html